<text x="22" y="558" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Acesso&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Painel&#160;administrativo&#160;remoto&#160;+&#160;túnel&#160;seguro&#160;para&#160;monitorar</tspan></text>
