<text x="22" y="54" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Plataforma&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Robô&#160;humanoide&#160;Booster&#160;K1&#160;—&#160;implantado&#160;e&#160;em&#160;uso&#160;numa&#160;escola</tspan></text>
<text x="22" y="96" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Missão&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Não&#160;é&#160;um&#160;chatbot&#160;vestindo&#160;um&#160;corpo&#160;de&#160;robô.&#160;Um</tspan></text>
<text x="22" y="117" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Sistema&#160;Robótico&#160;Pessoal&#160;completo:&#160;identidade,&#160;sentidos</text>
<text x="22" y="138" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;e&#160;comportamento&#160;funcionando&#160;juntos&#160;como&#160;um&#160;só&#160;produto.</text>
<text x="22" y="180" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Voz&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Fala&#160;para&#160;fala&#160;em&#160;tempo&#160;real&#160;—&#160;sem&#160;pipeline&#160;STT&#160;→&#160;LLM&#160;→&#160;TTS,</tspan></text>
<text x="22" y="201" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;um&#160;loop&#160;de&#160;conversa&#160;contínuo</text>
<text x="22" y="243" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Identidade&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Persona&#160;persistente&#160;+&#160;base&#160;de&#160;conhecimento&#160;customizada,</tspan></text>
<text x="22" y="264" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;configurável&#160;ao&#160;vivo&#160;num&#160;painel&#160;—&#160;o&#160;robô&#160;se&#160;mantém&#160;"no&#160;personagem"</text>
<text x="22" y="306" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Percepção&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Visão&#160;computacional:&#160;detecção&#160;de&#160;pessoas/objetos,&#160;câmera</tspan></text>
<text x="22" y="327" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;de&#160;cabeça&#160;ao&#160;vivo,&#160;mimetismo&#160;de&#160;movimento&#160;(webcam&#160;→&#160;robô)</text>
<text x="22" y="369" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Movimento&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Biblioteca&#160;de&#160;gestos&#160;sincronizada&#160;com&#160;a&#160;fala&#160;—&#160;ele&#160;se&#160;move</tspan></text>
<text x="22" y="390" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;enquanto&#160;fala,&#160;não&#160;é&#160;uma&#160;cabeça&#160;parada&#160;com&#160;alto-falante</text>
<text x="22" y="432" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Resiliência&#160;&#160;</tspan><tspan fill="#c9d1d9">Failover&#160;automático&#160;entre&#160;modelo&#160;em&#160;nuvem&#160;(online)&#160;e</tspan></text>
<text x="22" y="453" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;modelo&#160;local&#160;(offline)&#160;—&#160;nunca&#160;fica&#160;em&#160;silêncio&#160;sem&#160;rede</text>
<text x="22" y="495" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Hardware&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Roteamento&#160;de&#160;áudio&#160;dinâmico&#160;—&#160;lapela,&#160;Bluetooth&#160;ou&#160;array</tspan></text>
