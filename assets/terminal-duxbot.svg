<text x="22" y="96" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Platform&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Booster&#160;K1&#160;humanoid&#160;robot&#160;—&#160;deployed&#160;&amp;&#160;live&#160;at&#160;a&#160;school</tspan></text>
<text x="22" y="138" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Mission&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Not&#160;a&#160;chatbot&#160;wearing&#160;a&#160;robot&#160;body.&#160;A&#160;full&#160;Personal</tspan></text>
<text x="22" y="159" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Robot&#160;System:&#160;identity,&#160;senses&#160;and&#160;behavior&#160;working</text>
<text x="22" y="180" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;together&#160;as&#160;one&#160;product.</text>
<text x="22" y="222" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Voice&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Real-time&#160;speech-to-speech&#160;—&#160;no&#160;STT&#160;→&#160;LLM&#160;→&#160;TTS&#160;pipeline,</tspan></text>
<text x="22" y="243" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;one&#160;continuous&#160;conversational&#160;loop</text>
<text x="22" y="285" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Identity&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Persistent&#160;persona&#160;+&#160;custom&#160;knowledge&#160;base,&#160;configurable</tspan></text>
<text x="22" y="306" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;live&#160;from&#160;an&#160;admin&#160;panel&#160;—&#160;the&#160;robot&#160;stays&#160;"in&#160;character"</text>
<text x="22" y="348" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Perception&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Computer&#160;vision:&#160;person/object&#160;detection,&#160;live&#160;head&#160;cam,</tspan></text>
<text x="22" y="369" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;real-time&#160;movement&#160;mimicry&#160;(webcam&#160;→&#160;robot)</text>
<text x="22" y="411" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Motion&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Gesture&#160;library&#160;synced&#160;to&#160;speech&#160;—&#160;it&#160;moves&#160;while&#160;it&#160;talks,</tspan></text>
<text x="22" y="432" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;not&#160;a&#160;static&#160;head&#160;with&#160;a&#160;speaker</text>
<text x="22" y="474" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Resilience&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Online&#160;(cloud&#160;LLM)&#160;↔&#160;offline&#160;(local&#160;model)&#160;automatic</tspan></text>
<text x="22" y="495" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;failover&#160;—&#160;never&#160;goes&#160;silent&#160;if&#160;the&#160;network&#160;drops</text>
<text x="22" y="537" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Hardware&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Dynamic&#160;audio&#160;routing&#160;—&#160;lapel&#160;mic,&#160;Bluetooth&#160;speaker&#160;or</tspan></text>
<text x="22" y="558" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;internal&#160;array,&#160;switchable&#160;live,&#160;no&#160;reboot&#160;needed</text>
<text x="22" y="600" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">Access&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">Remote&#160;admin&#160;panel&#160;+&#160;secure&#160;tunnel&#160;for&#160;full&#160;monitoring</tspan></text>
